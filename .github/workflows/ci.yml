name: Go CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: go-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: gofmt, vet, test, ops tests, cross-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Tools
        run: |
          command -v make >/dev/null || { sudo apt-get update && sudo apt-get install -y make; }
          command -v shellcheck >/dev/null || { sudo apt-get update && sudo apt-get install -y shellcheck; }
          make --version | head -1
          shellcheck --version | head -1
          go version

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -count=1 ./...

      - name: macOS installer shellcheck and tests
        run: |
          shellcheck ops/install-agent-macos.sh ops/test-install-agent-macos.sh
          bash ops/test-install-agent-macos.sh

      - name: ops tests
        run: bash ops/test-ops.sh

      - name: Cross-build agent (darwin, windows)
        env:
          CGO_ENABLED: "0"
        run: |
          for target in darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            flags=()
            case "$target" in windows/*) flags=(-ldflags=-H=windowsgui) ;; esac
            GOOS="${target%/*}" GOARCH="${target#*/}" go build "${flags[@]}" -o /dev/null ./cmd/clawctl-agent
          done

  agent-bootstrap-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and check Hub Fly bootstrap archives
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="ci-${COMMIT_SHA:0:12}"
          [[ "$version" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$ ]]
          docker buildx build -f ops/docker/Dockerfile --target hub-fly \
            --build-arg "CLAWCTL_VERSION=$version" --load -t clawctl-hub:ci .
          container=$(docker create clawctl-hub:ci)
          trap 'docker rm -v "$container"' EXIT
          mkdir -p "$RUNNER_TEMP/bootstrap-share" "$RUNNER_TEMP/bootstrap-seed"
          docker cp "$container:/usr/local/share/clawctl/agent-bootstrap/." "$RUNNER_TEMP/bootstrap-share/"
          docker cp "$container:/opt/clawctl-seed/agent-bootstrap/." "$RUNNER_TEMP/bootstrap-seed/"
          bash ops/docker/test-agent-bootstrap-image.sh "$RUNNER_TEMP/bootstrap-share/$version"
          bash ops/docker/test-agent-bootstrap-image.sh "$RUNNER_TEMP/bootstrap-seed/$version"
          docker image inspect -f '{{.Size}}' clawctl-hub:ci

  macos-installer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: macOS installer tests
        run: |
          /bin/bash ops/test-install-agent-macos.sh
          /bin/bash -n ops/install-agent-macos.sh

  race:
    name: race (${{ matrix.name }})
    runs-on: ubuntu-latest
    # The store package alone takes about 12 minutes under -race on a
    # developer box, which is past go test's default 10m timeout. Each group
    # runs in its own job with an explicit -timeout. On GitHub runners the
    # store group already took ~44m on main (Oct 2026), right at the old 45m
    # go test limit, so allow 75m / 90m to avoid timing flakes.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: store
            packages: ./internal/store/
          - name: hub
            packages: ./cmd/clawctl-hub/
          - name: agent
            packages: ./cmd/clawctl-agent/ ./internal/probe/
          - name: links
            packages: ./internal/agentlink/ ./internal/agentrelay/ ./internal/agenthub/ ./internal/agentpty/ ./internal/operatorclient/
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Tools
        run: command -v make >/dev/null || { sudo apt-get update && sudo apt-get install -y make; }

      - name: go test -race
        run: go test -race -count=1 -timeout 75m ${{ matrix.packages }}
