# Blackbox exporter modules of ops/prometheus/install-hub-probe.sh.
modules:
  # The Hub's GET /healthz answers 200 with the body "alive".
  clawctl_hub_healthz:
    prober: http
    timeout: 10s
    http:
      method: GET
      valid_status_codes: [200]
      follow_redirects: false
      preferred_ip_protocol: ip4
      fail_if_body_not_matches_regexp:
        - '^alive\n?$'
