# Recommended Autopilot public HTTPS pack: clawctl-hub on Fly.io. Edit app and primary_region before the first deploy.
# NOTE: DO NOT edit this file in the tree directly. Doing so will make `git describe`
# produce a -dirty version. Instead, copy it out of the tree:
#   mkdir -p ~/clawctl-fly && cp ops/fly/fly.toml ~/clawctl-fly/fly.toml
# Then pass --config ~/clawctl-fly/fly.toml to the fly deploy command.
#
# Fly terminates HTTPS and forwards HTTP/WebSockets to Hub in local auth mode.
#
# Deploy from the repository root so the Docker context is the module root:
#   fly deploy . \
#     --config ~/clawctl-fly/fly.toml \
#     --dockerfile ops/docker/Dockerfile \
#     --build-target hub-fly \
#     --build-arg CLAWCTL_VERSION="$(git rev-parse --short HEAD)" \
#     --ha=false
#
# Create the volume before deploying with --size 3:
#   fly volumes create clawctl_data --region CHANGE-ME --size 3
#
# Keep a single machine: fly scale count 1, and fly deploy --ha=false.

app = "clawctl-hub-CHANGE-ME"
primary_region = "CHANGE-ME"

kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  build-target = "hub-fly"

  [build.args]
    CLAWCTL_VERSION = "dev"

[env]
  CLAWCTL_PORT = "8787"
  CLAWCTL_AUTH_MODE = "local"

[[mounts]]
  source = "clawctl_data"
  destination = "/var/lib/clawctl"

[[restart]]
  policy = "always"

[[vm]]
  # shared-cpu-2x (12.5% CPU baseline): on shared-cpu-1x (6.25%) litestream
  # compaction plus Hub derivation exhausted the Fly CPU burst balance after a
  # redeploy and the Hub was quota-throttled (2026-10-18 incident).
  size = "shared-cpu-2x"
  memory = "1024mb"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    grace_period = "30s"
    interval = "30s"
    timeout = "5s"
