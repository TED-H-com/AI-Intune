{{define "secrets.html"}}{{template "head" .}}
<div class="page-heading"><div><h1>Secrets</h1><p>Read-only status of configured secret references. Values are never displayed.</p></div></div>
<div class="panel"><table><thead><tr><th>Name</th><th>Reference</th><th>Status</th></tr></thead><tbody>
{{range .Secrets}}<tr><td>{{.Name}}</td><td class="mono">{{.Ref}}</td><td>{{.Status}}</td></tr>{{else}}<tr><td colspan="3">No secret references configured.</td></tr>{{end}}
</tbody></table></div>
{{template "foot" .}}{{end}}
