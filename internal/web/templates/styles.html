{{define "interface-styles"}}
<style>
:root{
  --topbar:#323130; --sidebar:#f3f2f1; --canvas:#faf9f8; --surface:#fff;
  --surface-alt:#f7f7f7; --line:#e1dfdd; --line-strong:#c8c6c4;
  --ink:#201f1e; --dim:#605e5c; --muted:#605e5c; --accent:#006fc9;
  --accent-soft:#eff6fc; --green:#107c10; --green-soft:#f1faf1;
  --amber:#ca5010; --amber-soft:#fff4e5; --red:#a4262c; --red-soft:#fde7e9;
  --grey:#605e5c; --blue:#006fc9; --warning-text:#8a3b00; --shadow:0 1px 3px rgba(0,0,0,.12);
  --topbar-height:52px; --sidebar-width:196px; --workload-width:188px;
  --accent-hover:#005a9e; --nav-hover:#edebe9; --radius:4px;
  --space-1:4px; --space-2:8px; --space-3:12px; --space-4:16px; --space-5:24px; --space-6:32px;
  --text-label:12px; --text-small:13px; --text-body:14px; --text-section:18px; --text-title:28px;
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",Arial,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--canvas);scroll-behavior:smooth}
body{
  margin:0;background:var(--canvas);color:var(--ink);
  font:var(--text-body)/1.6 var(--font-ui);
}
a{color:var(--accent);text-underline-offset:2px}
a:hover{color:var(--accent-hover)}
button,input,select,textarea{font:inherit}
button,.button,input,select{min-height:36px}
input,select,textarea{
  max-width:100%;border:1px solid var(--line-strong);border-radius:var(--radius);background:#fff;
  color:var(--ink);padding:6px 9px;
}
input:focus,select:focus,textarea:focus,a:focus-visible,button:focus-visible{
  outline:2px solid var(--accent);outline-offset:2px;
}
button,.button{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--accent);
  border-radius:var(--radius);background:var(--accent);color:#fff;padding:6px 13px;text-decoration:none;
  cursor:pointer;font-weight:600;
}
button:hover,.button:hover{background:var(--accent-hover);color:#fff}
button.danger,.button.danger{background:#b42318;border-color:#b42318;color:#fff}
button.danger:hover,.button.danger:hover{background:#912018;border-color:#912018;color:#fff}
.button.secondary,button.secondary{background:#fff;color:var(--ink);border-color:var(--line-strong)}
.button.secondary:hover,button.secondary:hover{background:var(--surface-alt);color:var(--ink)}
.skip-link{position:fixed;left:10px;top:-60px;z-index:100;background:#fff;padding:9px 14px}
.skip-link:focus{top:7px}
.sr-only{
  position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;
  overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important;
}

.topbar{
  position:sticky;top:0;z-index:30;height:var(--topbar-height);display:flex;align-items:center;
  gap:18px;background:var(--topbar);color:#fff;padding:0 18px;box-shadow:0 1px 2px rgba(0,0,0,.25);
}
.topbar a{color:inherit;text-decoration:none}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.brand-mark{
  display:grid;place-items:center;width:22px;height:22px;border-radius:var(--radius);background:#2b88d8;
  color:#fff;font-size:var(--text-label);font-weight:700;
}
.topbar-tools{margin-left:auto;display:flex;align-items:center;height:100%;gap:4px}
.topbar-boundary{display:flex;align-items:center;gap:7px;padding:0 11px;color:#e1dfdd;font-size:12px}
.topbar-boundary .dot{margin:0}
.operator-chip{display:flex;align-items:center;gap:7px;padding:3px 9px;border-left:1px solid rgba(255,255,255,.24);font-size:12px;color:#fff;white-space:nowrap}
.operator-chip .operator-detail{color:#c8c6c4}
.language-form{margin:0;display:inline-flex}
.language-switch{
  background:transparent;font:inherit;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;min-height:30px;padding:3px 9px;
  border:1px solid rgba(255,255,255,.34);border-radius:var(--radius);color:#fff;font-size:12px;white-space:nowrap;
}
.language-switch:hover{background:rgba(255,255,255,.12);color:#fff}
.clock{padding-left:12px;border-left:1px solid rgba(255,255,255,.24);color:#e1dfdd;font-size:12px;white-space:nowrap}

.app-shell{display:grid;grid-template-columns:var(--sidebar-width) minmax(0,1fr);min-height:calc(100vh - var(--topbar-height))}
.sidebar{
  position:sticky;top:var(--topbar-height);align-self:start;height:calc(100vh - var(--topbar-height));
  overflow-y:auto;background:var(--sidebar);border-right:1px solid var(--line);padding:10px 0 22px;
}
.nav-group-label{
  padding:12px 20px 5px;color:var(--muted);font-size:var(--text-label);font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;
}
.sidebar nav{display:block}
.nav-item{
  position:relative;display:flex;align-items:center;gap:11px;min-height:40px;padding:8px 16px;
  color:var(--ink);text-decoration:none;border-left:3px solid transparent;
}
.nav-item:hover{background:var(--nav-hover);color:var(--ink)}
.nav-item.on,.nav-item[aria-current="page"]{background:var(--accent-soft);border-left-color:var(--accent);font-weight:600}
.nav-icon{width:18px;height:18px;display:grid;place-items:center;flex:none;color:#0078d4}
.nav-icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav-separator{height:1px;background:var(--line-strong);margin:12px 20px}
.sidebar-note{margin:18px 20px 0;padding-top:14px;border-top:1px solid var(--line-strong);color:var(--dim);font-size:12px}

.mfa-warning{padding:12px 16px;border:1px solid #d29200;background:#fff4ce;color:var(--warning-text)}
.workspace-shell{display:grid;grid-template-columns:minmax(0,1fr);min-width:0}
.workspace-shell.with-workload-nav{grid-template-columns:var(--workload-width) minmax(0,1fr)}
.workload-rail{
  position:sticky;top:var(--topbar-height);align-self:start;height:calc(100vh - var(--topbar-height));
  overflow-y:auto;background:#fff;border-right:1px solid var(--line);padding:16px 0 24px;
}
.workload-title{padding:0 18px 13px;font-size:18px;font-weight:600;color:var(--ink)}
.main-content{min-width:0;padding:var(--space-5) var(--space-6) 64px}
.content-inner{width:100%;max-width:1600px;margin:0 auto}
.breadcrumb{display:flex;align-items:center;gap:8px;min-height:26px;color:var(--dim);font-size:12px;margin-bottom:8px}
.breadcrumb a{text-decoration:none}
.breadcrumb-separator{color:var(--muted)}
.subnav{display:block;margin:0}
.subnav-item{
  display:flex;align-items:center;min-height:36px;padding:7px 18px;border-left:3px solid transparent;
  color:var(--ink);font-size:var(--text-body);text-decoration:none;
}
.subnav-item:hover{background:var(--surface-alt);color:var(--ink)}
.subnav-item.on,.subnav-item[aria-current]{border-left-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.section-anchor{display:block;scroll-margin-top:calc(var(--topbar-height) + 58px)}
.page-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin:0 0 18px}
.page-heading h1{font-size:var(--text-title);line-height:1.3;font-weight:600;margin:0 0 5px}
.page-heading > div:first-child{min-width:0;flex:1}
.page-heading > .command-bar{flex:none;max-width:100%}
.page-heading p{margin:0;color:var(--dim)}
.command-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* 第一屏仍然用完整句子，KPI 只負責讓人掃讀，不取代證據邊界。 */
.headline{margin:0 0 16px}
.headline p{font-size:15px;line-height:1.5;margin:0 0 5px}
.headline p:first-child{font-size:var(--text-section);font-weight:600;color:var(--ink)}
.headline .quiet{color:var(--dim)}

h1{font-size:var(--text-title);font-weight:600;line-height:1.3;margin:0 0 var(--space-5);overflow-wrap:anywhere}
h2{
  font-size:var(--text-section);font-weight:600;color:var(--ink);letter-spacing:0;margin:30px 0 11px;
  border:0;padding:0;
}
h3{font-size:14px;margin:18px 0 8px}
h2[id]{scroll-margin-top:calc(var(--topbar-height) + 12px)}
.panel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;
  overflow-x:auto;
}
.panel + .panel{margin-top:14px}
details.panel > summary{cursor:pointer;font-weight:600;list-style-position:outside}
details.panel > summary + *{margin-top:12px}

.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 18px}
.metric-card{
  min-width:0;min-height:128px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:var(--space-4);display:flex;flex-direction:column;color:var(--ink);text-decoration:none;
}
.metric-card:hover{border-color:#8a8886;color:var(--ink);background:var(--accent-soft)}
.metric-label{font-size:14px;font-weight:600;margin-bottom:12px}
.metric-value{font-size:32px;line-height:1.1;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-bottom:9px}
.metric-note{color:var(--dim);font-size:13px;margin-top:auto}
.metric-state{display:inline-flex;align-items:center;gap:7px}
.metric-state .dot{margin:0}
.dashboard-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(270px,1fr);gap:14px;align-items:start}
.dashboard-stack{display:grid;gap:14px}
.dashboard-stack .panel + .panel{margin-top:0}
.panel-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-2px 0 12px}
.panel-title h2{margin:0;font-size:16px}
.panel-title a{font-size:var(--text-body);text-decoration:none}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;margin:30px 0 11px}
.section-title h2{margin:0}
.active-filter{margin:0;color:var(--dim);font-size:13px}
.active-filter a{margin-left:8px}
.signal-list{list-style:none;margin:0;padding:0}
.signal-list li{padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:9px;align-items:flex-start}
.signal-list li:last-child{border-bottom:0}
.signal-list .dot{margin-top:7px}

.table-scroll{position:relative;max-width:100%;overflow-x:auto;overscroll-behavior-x:contain}
table{width:100%;border-collapse:collapse;background:var(--surface)}
caption{text-align:left;font-weight:600;padding:0 0 10px}
th{
  text-align:left;font-size:12px;font-weight:600;color:var(--dim);padding:10px 12px;
  border-bottom:1px solid var(--line-strong);white-space:nowrap;background:#fafafa;
}
td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--accent-soft)}
td.name a{font-weight:600;text-decoration:none}
td.name .sub{display:block;color:var(--dim);font-size:12px;font-weight:400}
td.reason{color:var(--dim);min-width:260px}

.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:baseline;flex:none}
.green{background:var(--green)} .amber{background:var(--amber)}
.red{background:var(--red)} .grey{background:var(--grey)} .blue{background:var(--blue)}
.st{font-weight:600}
.st.green{background:none;color:var(--green)}
.st.blue{background:none;color:var(--blue)}
.st.amber{background:none;color:var(--amber)}
.st.red{background:none;color:var(--red)}
.st.grey{background:none;color:var(--grey)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
.dim{color:var(--dim)}
.small{font-size:13px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#f5f5f5;padding:1px 3px;border-radius:var(--radius)}

ul.findings{list-style:none;margin:0;padding:0}
ul.findings li{padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
ul.findings li:last-child{border-bottom:none}
ul.findings .who{color:var(--dim);flex:none;min-width:96px}
.caveat{
  border-left:3px solid var(--amber);background:var(--amber-soft);color:#5c3b00;
  padding:12px 15px;border-radius:0 3px 3px 0;margin:14px 0;font-size:14px;
}
.caveat b{color:#7a3e00}
.strip{display:flex;gap:2px;align-items:flex-end;height:26px}
.strip i{display:block;width:6px;border-radius:1px}
.swatch{display:inline-block;width:8px;height:8px;border-radius:1px;margin:0 4px 0 8px}
pre.copy{
  background:#f7f7f7;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;overflow-x:auto;
  margin:8px 0 0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;color:#323130;
}
blockquote.summary{margin:0 0 14px;padding:10px 14px;border-left:2px solid var(--line-strong);color:var(--ink);white-space:pre-wrap;font-size:14px}
blockquote.summary .meta{display:block;color:var(--dim);font-size:12px;margin-bottom:5px}
.empty{color:var(--dim);font-style:normal;padding:var(--space-5) var(--space-3)}
.field-label{display:block;font-weight:600;font-size:13px;margin:0 0 4px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px;align-items:end}
.disk-form{display:grid;gap:16px;margin-top:16px}
.disk-form fieldset{border:1px solid var(--line);border-radius:4px;padding:16px;margin:0;min-width:0}
.disk-form legend{font-weight:600;padding:0 6px}
.disk-form label{display:block}
.disk-form input:not([type="checkbox"]):not([type="radio"]),.disk-form select,.disk-form textarea{width:100%;box-sizing:border-box}
.disk-button-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:0}
.disk-schedule{border-top:1px solid var(--line);margin-top:24px;padding-top:16px}
.disk-badge{display:inline-block;border-radius:12px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.disk-ok{background:#e6f4ea;color:#176536}
.disk-skipped{background:#fff2d5;color:#785200}
.disk-error{background:#fde7e9;color:#a4262c}
.disk-usage{width:100%;height:18px}
.disk-mount + .disk-mount{border-top:1px solid var(--line);margin-top:16px;padding-top:8px}
.disk-report-filters{display:flex;flex-wrap:wrap;gap:20px;align-items:end;margin-bottom:20px}
.disk-report-filters label{display:flex;flex-direction:column;gap:6px}
.disk-report-actions{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}
.disk-report-actions button:disabled,.disk-report-table button:disabled{background:#e5e7eb;color:#6b7280;border:1px solid #cbd5e1;box-shadow:none;cursor:not-allowed;opacity:.75}
.disk-report-table input:disabled{opacity:.45;cursor:not-allowed;accent-color:#9ca3af}
.disk-report-scroll{max-width:100%;overflow-x:auto}
.disk-report-table{width:100%;table-layout:fixed;font-size:.875rem}
.disk-report-table th,.disk-report-table td{white-space:normal;overflow-wrap:anywhere;padding:10px 6px;vertical-align:top}
.disk-report-table th:nth-child(1){width:5%}.disk-report-table th:nth-child(2){width:25%}.disk-report-table th:nth-child(3){width:11%}.disk-report-table th:nth-child(4){width:16%}.disk-report-table th:nth-child(5){width:8%}.disk-report-table th:nth-child(6){width:8%}.disk-report-table th:nth-child(7){width:9%}.disk-report-table th:nth-child(8){width:7%}.disk-report-table th:nth-child(9){width:11%}
.disk-report-table code{white-space:normal;overflow-wrap:anywhere;word-break:break-word}
.disk-report-table button{max-width:100%;margin-bottom:6px;padding:5px 7px;font-size:var(--text-small)}
@media(max-width:800px){.disk-report-table{min-width:900px}}
.disk-review-request{white-space:pre-wrap;overflow-wrap:anywhere;background:#f7f7f7;border:1px solid var(--line);padding:16px}
.disk-form-grid{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.form-grid label,.form-grid input,.form-grid select{width:100%}
.enrollment-form{
  display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:end;margin:var(--space-3) 0 var(--space-1);
}
.enrollment-form label{flex:1 1 220px;min-width:0}
.enrollment-form input,.enrollment-form select{width:100%}
.enrollment-form button{flex:none}
.enrollment-form small{display:block;color:var(--dim);font-size:var(--text-label)}
.action-form{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin:10px 0 4px}
.action-form label{flex:1 1 220px}
.action-form input,.action-form select{width:100%}
.action-form button{flex:0 0 auto}
.section-anchor:focus{outline:2px solid var(--accent);outline-offset:4px}


/* Shared list, detail, review and account patterns. */
.panel-stack{display:grid;gap:var(--space-4);min-width:0}
.panel-stack > .panel + .panel{margin-top:0}
.panel-stack h2,.panel-title h2{overflow-wrap:anywhere;min-width:0}
.disclosure-section{border-top:1px solid var(--line);padding-top:var(--space-2);min-width:0}
.disclosure-section > summary{margin-bottom:var(--space-2)}
.row-actions{display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-2)}
.row-actions form{margin:0}
.row-actions button{white-space:nowrap}
.facts{display:grid;grid-template-columns:minmax(120px,180px) minmax(0,1fr);column-gap:var(--space-5);row-gap:var(--space-3);margin:var(--space-4) 0}
.facts dt{grid-column:1;color:var(--dim);font-weight:600;overflow-wrap:anywhere}
.facts dd{grid-column:2;margin:0;min-width:0;overflow-wrap:anywhere}
.facts dd > :first-child{margin-top:0}
.facts dd > :last-child{margin-bottom:0}
.metric-grid-pair{grid-template-columns:repeat(2,minmax(0,1fr))}
.disk-report-table.read-only th:nth-child(n){width:auto}
.disk-report-table.read-only th:first-child{width:28%}

.panel{min-width:0;position:relative}
.panel[id]{scroll-margin-top:calc(var(--topbar-height) + var(--space-4))}
.panel > :first-child{margin-top:0}
.panel > :last-child{margin-bottom:0}
.panel-title{flex-wrap:wrap}
.table-panel{padding:0}
.table-panel > table{margin:0}
.table-panel > .pagination,.table-panel > .table-footer{padding:var(--space-3) var(--space-4)}
.pagination,.button-row,.filter-row{display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap}
.fleet-context{margin-top:var(--space-5)}
.filter-panel{margin-bottom:var(--space-4)}
.filter-row{align-items:end}
.filter-row label{display:grid;gap:var(--space-1);flex:1 1 150px;min-width:0}
.filter-row label input,.filter-row label select{width:100%}
.filter-row .page-size{flex:0 1 80px}
.filter-states{border:0;border-top:1px solid var(--line);padding:var(--space-3) 0 0;margin:var(--space-4) 0 0}
.filter-states legend{padding:0 var(--space-2) 0 0}
.checkbox-row{display:flex;flex-wrap:wrap;gap:var(--space-2) var(--space-4)}
.checkbox-row label{display:inline-flex;align-items:center;gap:var(--space-2)}
input[type="checkbox"],input[type="radio"]{width:16px;min-width:16px;height:16px;min-height:0;padding:0;margin:0 var(--space-1) 0 0;vertical-align:middle;accent-color:var(--accent)}
textarea{resize:vertical;min-height:88px}
fieldset{min-width:0;border:1px solid var(--line);border-radius:var(--radius);padding:var(--space-4)}
legend{padding:0 var(--space-2);font-weight:600}
summary{cursor:pointer;min-height:36px;padding:var(--space-1) 0}
summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
pre{max-width:100%;overflow:auto}
code,.mono,td{overflow-wrap:anywhere}
.chip{margin-left:auto;padding:0 var(--space-2);border-radius:var(--radius);background:var(--surface);font-size:var(--text-label);font-variant-numeric:tabular-nums}
button.nav-item{width:100%;justify-content:flex-start;background:transparent;color:var(--ink);border-top:0;border-right:0;border-bottom:0;border-radius:0;font-weight:400}
button.nav-item:hover{background:var(--nav-hover)}
.build-footer{margin-top:var(--space-6);padding-top:var(--space-4);border-top:1px solid var(--line)}
.disk-form > button{justify-self:start}
.account-content #issued-token{width:100%}
.account-content form button + button{margin-left:var(--space-2)}
.disk-form label:has(input[type="checkbox"]){display:flex;align-items:center;gap:var(--space-2)}
form[method="get"] button{background:var(--surface);color:var(--accent)}
form[method="get"] button:hover{background:var(--accent-soft)}
[role="alert"]:not(:empty),.error{padding:var(--space-3) var(--space-4);background:var(--red-soft);color:var(--red);border:1px solid var(--red);border-radius:var(--radius)}
[aria-invalid="true"]{outline:2px solid var(--red)}
.account-content{max-width:960px;margin:var(--space-6) auto;padding:var(--space-5);min-width:0}
.account-content > form{padding:var(--space-5);margin:var(--space-4) 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.account-content form > h2:first-child{margin-top:0}
.account-content label{display:block;margin:var(--space-4) 0 var(--space-1);font-weight:600}
