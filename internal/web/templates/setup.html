{{template "account-head" "Create your Hub admin"}}
<h1>Create your Hub admin</h1>{{if .Error}}<p role="alert">{{.Error}}</p>{{end}}<form method="post" action="/setup">
<input type="hidden" name="next" value="{{.Next}}"><label>Username<input name="username" autocomplete="username" required minlength="3" maxlength="64"></label>
<label>Setup code<input name="setup_code" autocomplete="off" required aria-describedby="setup-help"></label><p id="setup-help">Find the setup code in the Hub log (e.g. <code>docker logs</code>, <code>fly logs</code>, <code>journalctl -u clawctl-hub</code>).</p>
<label>Password<input type="password" name="password" autocomplete="new-password" required minlength="12" maxlength="256"></label><p>Use 12–256 bytes for your password.</p><button type="submit">Create admin</button></form>{{template "account-foot" .}}
