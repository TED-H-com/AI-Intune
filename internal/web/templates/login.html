{{template "account-head" "Sign in"}}
<h1>Sign in</h1>{{if .Error}}<p role="alert">{{.Error}}</p>{{end}}<form method="post" action="/login">
<input type="hidden" name="next" value="{{.Next}}"><label>Username or email<input name="username" autocomplete="username" required minlength="3" maxlength="254"></label>
<label>Password<input type="password" name="password" autocomplete="current-password" required maxlength="256"></label><button type="submit">Sign in</button></form>{{template "account-foot" .}}
